# Baut die Wiz-fan-Club-App automatisch als WizFanClubApp.exe, sobald sich etwas in app/ ändert.
# Ergebnis: GitHub → Releases → "app-test" (Branch test) bzw. "app-main" (Branch main)
name: App bauen

on:
  push:
    branches: [test, main]
    paths: ['app/**', 'rok_kampf_upload.py', '.github/workflows/build-app.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Werkzeuge installieren
        run: pip install pyinstaller pillow
      - name: Icon erzeugen
        run: python app/make_icon.py app/icon.ico
      - name: Kommandanten-Bilder (aus icons/comander der Website)
        run: python app/make_heroicons.py . app/heroicons
      - name: Uploader-Modul beilegen
        shell: cmd
        run: copy rok_kampf_upload.py app\rok_kampf_upload.py
      - name: Titel-Schrift (Cinzel, wie auf der Website) laden
        shell: bash
        run: curl -sSL -o app/Cinzel.ttf "https://github.com/google/fonts/raw/main/ofl/cinzel/Cinzel%5Bwght%5D.ttf" || true
      - name: EXE bauen
        shell: bash
        run: |
          EXTRA=""
          if [ -s app/Cinzel.ttf ]; then EXTRA='--add-data app/Cinzel.ttf;.'; fi
          if [ -d app/sounds ] && [ -n "$(ls -A app/sounds 2>/dev/null)" ]; then EXTRA="$EXTRA --add-data app/sounds;sounds"; fi
          pyinstaller --onefile --noconsole --name WizFanClubApp --icon app/icon.ico --add-data "app/icon.ico;." --add-data "app/heroicons;heroicons" $EXTRA --paths app --hidden-import rok_kampf_upload app/rok_app.py
      - name: Release aktualisieren
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="app-${{ github.ref_name }}"
          # Release nur aktualisieren statt loeschen -> der Download-Link funktioniert auch waehrend des Bauens
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/WizFanClubApp.exe --clobber
            gh release edit "$TAG" --draft=false --notes "Automatisch gebaut aus Commit ${{ github.sha }}"
          else
            gh release create "$TAG" dist/WizFanClubApp.exe --target "${{ github.sha }}" \
              --title "Wiz fan Club App (${{ github.ref_name }})" \
              --notes "Automatisch gebaut aus Commit ${{ github.sha }}" \
              --prerelease=${{ github.ref_name != 'main' }}
          fi
          # Sicherheitsnetz: Release darf nie als Entwurf (unsichtbar) haengen bleiben
          gh release edit "$TAG" --draft=false
          gh release view "$TAG" --json assets --jq '.assets[].name' 
